name: Build

# Builds RepeatViewer for Linux, Windows and macOS with the scripts in packaging/.
# Runs when a version tag is pushed (git tag v1.1.0 && git push origin v1.1.0)
# and attaches the builds to a GitHub Release. Can also be started by hand from
# the Actions tab ("Run workflow"); the builds then appear as downloadable
# artifacts on the run page.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build macOS (uses more minutes on a private repo)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  version:
    name: Version check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Tag and code version must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          code="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' repeatviewer/__init__.py)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$code" != "$tag" ]; then
            echo "::error::Tag v$tag does not match __version__ = \"$code\" in repeatviewer/__init__.py. Change the version in the code, commit, then move the tag."
            exit 1
          fi
          echo "Version $code matches the tag."

  linux:
    name: Linux x86_64
    needs: version
    runs-on: ubuntu-latest
    # glibc 2.28 base (AlmaLinux 8): the build runs on RHEL/Rocky 8+,
    # Ubuntu 20.04+ and Debian 11+, which covers most HPC servers.
    # Plain AlmaLinux, not manylinux: manylinux Pythons have no libpython
    # shared library, which PyInstaller needs.
    container: almalinux:8
    timeout-minutes: 60
    env:
      PIP_CACHE_DIR: /tmp/pip-cache
    steps:
      - name: Install Python, build tools and Qt runtime libraries
        run: |
          dnf install -y --setopt=strict=0 \
            git tar gzip findutils which \
            python3.11 python3.11-devel gcc gcc-c++ make \
            mesa-libGL mesa-libEGL libxkbcommon libxkbcommon-x11 \
            fontconfig freetype dbus-libs nss nspr alsa-lib \
            libXcomposite libXdamage libXrandr libXtst libxshmfence \
            xcb-util-wm xcb-util-image xcb-util-keysyms xcb-util-renderutil \
            xcb-util-cursor

      - uses: actions/checkout@v4

      - name: Create build environment
        run: |
          python3.11 -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -e .

      - name: Build
        run: bash packaging/linux/build_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RepeatViewer-linux-x86_64
          path: dist/RepeatViewer-*-linux-*.tar.gz
          compression-level: 0
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create build environment
        run: |
          python -m venv venv
          venv\Scripts\python.exe -m pip install --upgrade pip
          venv\Scripts\python.exe -m pip install -e .

      - name: Check bundled MAFFT scripts are LF
        shell: bash
        run: |
          if grep -l $'\r' repeatviewer/backends/mafft/windows/usr/bin/mafft; then
            echo "::error::MAFFT script has CRLF line endings; check .gitattributes"
            exit 1
          fi

      - name: Build
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: RepeatViewer-windows-x64
          path: dist/RepeatViewer-*-windows-x64.zip
          compression-level: 0
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: version
    if: startsWith(github.ref, 'refs/tags/v') || inputs.macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create build environment
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -e .

      - name: Build
        run: bash packaging/macos/build_macos_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RepeatViewer-macos-${{ matrix.arch }}
          path: dist/RepeatViewer-*-macos-*.dmg
          compression-level: 0
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success'
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: true
          generate_release_notes: true
